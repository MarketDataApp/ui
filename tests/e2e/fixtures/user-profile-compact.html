<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>user-profile layout fixture (#38)</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/dist/css/components.css" />
    <style>
      /*
        Stands in for a consumer navbar: a flex row deliberately too narrow for
        its contents, which is the condition that used to squeeze the pill.
      */
      .navbar {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 240px;
        border: 1px solid #ccc;
      }
      .navbar-filler {
        flex: 1 1 auto;
        min-width: 0;
      }
    </style>
  </head>
  <body>
    <div class="navbar">
      <span class="navbar-filler">Data Products Learn Pricing Company</span>
      <div id="pill-full" class="user-profile-container"></div>
    </div>

    <div class="navbar">
      <span class="navbar-filler">Data Products Learn Pricing Company</span>
      <div id="pill-compact" class="user-profile-container user-profile-compact"></div>
    </div>

    <!--
      Deliberately never initialised (#40). It holds the reservation the
      container makes before the user fetch resolves, so a test can compare
      the space reserved against the space the pill above actually takes.
    -->
    <div class="navbar">
      <span class="navbar-filler">Data Products Learn Pricing Company</span>
      <div id="pill-reserved" class="user-profile-container"></div>
    </div>

    <script type="module">
      // The fixture is served from localhost, so fetchUser()'s CORS safety
      // check already resolves to logged out without a request. The stub keeps
      // the fixture hermetic if it is ever served from a marketdata.app host.
      window.fetch = () => Promise.resolve({ ok: false, status: 401 });

      const { initUserProfile } = await import('/dist/user-profile.js');

      await Promise.all([
        initUserProfile({ container: document.getElementById('pill-full'), dropdown: true }),
        initUserProfile({ container: document.getElementById('pill-compact'), dropdown: true }),
      ]);

      document.body.dataset.ready = 'true';
    </script>
  </body>
</html>
